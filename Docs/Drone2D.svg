<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Drone2D tilted at angle phi</title>
  <desc id="desc">Two masses joined by a link of length l, tilted counterclockwise by angle phi from the horizontal. Thrust F1 and F2 act perpendicular to the link, and gravity acts downward at the center.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9302c"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222222">
    <!-- World axes -->
    <line x1="50" y1="385" x2="130" y2="385" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="50" y1="385" x2="50" y2="305" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <text x="138" y="391">x</text>
    <text x="44" y="297">y</text>

    <!-- Horizontal reference and angle -->
    <line x1="320" y1="230" x2="510" y2="230" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M395 230 A75 75 0 0 0 384.95 192.5" fill="none" stroke="#222222" stroke-width="1.5"/>
    <text x="409" y="214" font-style="italic" font-size="19">φ</text>

    <!-- Link -->
    <line x1="172.8" y1="315" x2="467.2" y2="145" stroke="#222222" stroke-width="5" stroke-linecap="round"/>

    <!-- Length labels -->
    <line x1="331" y1="197" x2="456" y2="125" stroke="#777777" stroke-width="1"/>
    <line x1="184" y1="282" x2="309" y2="210" stroke="#777777" stroke-width="1"/>
    <text x="388" y="154" text-anchor="middle" transform="rotate(-30 388 154)">l/2</text>
    <text x="241" y="239" text-anchor="middle" transform="rotate(-30 241 239)">l/2</text>

    <!-- Thrust -->
    <line x1="467.2" y1="145" x2="422.2" y2="67.1" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <line x1="172.8" y1="315" x2="127.8" y2="237.1" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="410" y="62" text-anchor="end" fill="#1f6feb" font-weight="bold">F₁</text>
    <text x="116" y="232" text-anchor="end" fill="#1f6feb" font-weight="bold">F₂</text>

    <!-- Gravity -->
    <line x1="320" y1="230" x2="320" y2="310" stroke="#c9302c" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="330" y="308" fill="#c9302c" font-weight="bold">m·g</text>

    <!-- Center and masses -->
    <circle cx="320" cy="230" r="5" fill="#222222"/>
    <text x="332" y="256">(x, y)</text>
    <circle cx="467.2" cy="145" r="13" fill="#222222"/>
    <circle cx="172.8" cy="315" r="13" fill="#222222"/>
    <text x="488" y="151">m₁ (right)</text>
    <text x="152" y="343" text-anchor="end">m₂ (left)</text>
  </g>
</svg>
