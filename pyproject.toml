[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "Robot2DStudio"
version = "0.0.1"
requires-python = ">= 3.13.2"
dependencies = [
    "numpy>=2.4.3,<3",
    "pillow>=12.1.1,<13",
    "matplotlib>=3.10.8,<4",
    "keyboard>=0.13.5,<0.14"
]

[project.scripts]
robot2DStudio = "Robot2DStudio.__main__:CLI"

[tool.setuptools.package-data]
Robot2DStudio = [
    "Robot2DStudio/Simulation/Configuration/*.json"
]